# GitHub Actions Workflow Configuration
#
# This file controls enable/disable toggles for shared workflows.
# Workflows default to enabled if this file is missing.
#
# - enabled: workflow 자체 활성화 (false면 수동 트리거도 비활성)
# - auto: PR 생성 시 자동 실행 여부 (없으면 해당 없음, 수동 트리거는 enabled만 체크)

# Shared workflow version pin for jhw7500/automation.
automation_ref: v1.45.3
automation_commit: 06183ff67c6052489ccac3b7cb37fd93aa3f6307

workflows:
  # Repo-specific
  shellcheck:
    # vendored NXP autotools 스크립트(imx-gst1.0-plugin/imx-vpuwrap의 autogen.sh,
    # configure~)가 lint를 통과하지 못한다 — 수정 대상이 아닌 업스트림 코드라 비활성.
    enabled: false
    description: "Shell script static analysis"

  build-test:
    enabled: false
    # 비활성: i.MX8MP Yocto SDK(aarch64 크로스) + hantro EULA 바이너리가 필요해
    # stock GitHub 러너에서 재현 불가. 빌드는 로컬 ./build.sh(Yocto SDK)로 검증한다.
    description: "Build and test the package"

  # Shared Gemini workflows
  gemini-dispatch:
    enabled: true
    description: "Central dispatcher for Gemini commands"

  gemini-invoke:
    enabled: true
    description: "General Gemini CLI invocation"

  gemini-review:
    enabled: true
    description: "PR code review with Gemini (manual: @gemini-cli /review)"

  gemini-triage:
    enabled: true
    description: "Issue triage and labeling"

  gemini-auto-review:
    enabled: true
    auto: true
    description: "Automatic PR review with Gemini"

  gemini-scheduled-triage:
    enabled: false
    description: "Scheduled issue triage (disabled to avoid hourly runs)"

  # Shared Claude workflows
  claude:
    enabled: true
    description: "Claude AI integration (manual: @claude)"

  claude-code-review:
    enabled: true
    auto: true
    description: "Claude automatic PR review"

# === Shared Settings ===
claude:
  model: "claude-sonnet-4-6"
